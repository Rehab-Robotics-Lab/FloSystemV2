joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

robot_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - l1
    - l2
    - l3
    - l4
    - r1
    - r2
    - r3
    - r4
  gains:
    l1: {p: 100.0, i: 0.01, d: 0.1}
    l2: {p: 100.0, i: 0.01, d: 0.1}
    l3: {p: 100.0, i: 0.01, d: 0.1}
    l4: {p: 100.0, i: 0.01, d: 0.1}
    r1: {p: 100.0, i: 0.01, d: 0.1}
    r2: {p: 100.0, i: 0.01, d: 0.1}
    r3: {p: 100.0, i: 0.01, d: 0.1}
    r4: {p: 100.0, i: 0.01, d: 0.1}
