services:
  flo_v2_aim1:
    image: flo_v2_image_aim1
    build:
      context: .
    container_name: flo_v2_aim1
    privileged: true
    stdin_open: true
    tty: true
    shm_size: 2gb
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      DISPLAY: host.docker.internal:0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_INDIRECT: "1"
      # Set to "true" to auto-run tmux_robot_bringup_legacy.sh on start.
      AUTO_BRINGUP: "false"
    ports:
      - "1883:1883"
      - "11311:11311"
      - "8080:8080"

  flo_v2_aim1_host:
    image: flo_v2_image_aim1
    build:
      context: .
    container_name: flo_v2_aim1_host
    profiles:
      - host
    privileged: true
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    pid: host
    shm_size: 2gb
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      DISPLAY: host.docker.internal:0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_IP: "127.0.0.1"
      # Set to "true" to auto-run tmux_robot_bringup_legacy.sh on start.
      AUTO_BRINGUP: "false"
