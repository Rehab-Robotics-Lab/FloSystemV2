services:
  flo_v2_aim1:
    image: flo_v2_image_aim1
    build:
      context: .
    container_name: flo_v2_aim1
    privileged: true
    stdin_open: true
    tty: true
    shm_size: 2gb
    devices:
      - ${FLO_MOTORS_HOST_DEVICE:-/dev/flo_motors}:/dev/flo_motors
      - ${FLO_LED_HOST_DEVICE:-/dev/flo_led}:/dev/flo_led
    environment:
      DISPLAY: host.docker.internal:0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_INDIRECT: "1"
      FLO_MOTORS_SERIAL_PORT: /dev/flo_motors
      LED_SERIAL_PORT: /dev/flo_led
      # Set to "true" to auto-run tmux_robot_bringup_legacy.sh on start.
      AUTO_BRINGUP: "true"
    ports:
      - "1883:1883"
      - "11311:11311"
      - "8080:8080"
    volumes:
      - ./runtime-status:/runtime-status

