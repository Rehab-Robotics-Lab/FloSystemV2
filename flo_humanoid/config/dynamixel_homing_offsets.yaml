# Dynamixel homing offsets in raw encoder ticks written to the motor control table.
# These are hardware-side offsets, distinct from the software-side joint angle offsets
# in dynamixel_offsets.yaml. Keep values at 0 until you have calibrated each motor.

# l1: 111          # left_shoulder_flexionextension
# l2: 112          # left_shoulder_abductionadduction
# l3: 122          # left_elbow_rotation
# l4: 121         # left_elbow_flexionextension
# # -------------  RIGHT ARM -------------
# r1: 211          # right_shoulder_flexionextension
# r2: 212          # right_shoulder_abductionadduction
# r3: 222          # right_elbow_rotation
# r4: 221          # right_elbow_flexionextension

homing_offsets:
  l1: 460 
  l2: 1700
  l3: -50
  l4: 100
  r1: 520
  r2: 1420
  r3: 50
  r4: 950
