# Simon Says – parameter set (all actions allowed for both arms)

left_actions:  &all_actions
  - D_WAVE
  - D_SWING_LATERAL
  # - D_RAISE
  # - D_SWING_FORWARD
  - S_RAISE
  - S_REACH_SIDE
  # - S_TOUCH_HEAD
  # - S_TOUCH_MOUTH

right_actions: *all_actions   # clone the same list

turn_timeout:          6.0        # seconds for player to copy the pose
face_duration:         3.0        # seconds robot shows happy/sad face
simon_ratio:           0.7       # 60 % of prompts include “Simon says”
total_rounds:          5         # stop after 15 dual-arm turns
threshold:             0.1        # threshold for pose similarity
inter_turn_delay:      1.5        # seconds to wait before next turn
static_threshold:      0.90      # threshold for static pose similarity
