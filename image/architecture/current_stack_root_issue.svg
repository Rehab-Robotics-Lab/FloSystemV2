<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .h1 { font: 700 18px Arial, sans-serif; fill: #111827; }
      .body { font: 14px Arial, sans-serif; fill: #111827; }
      .body-white { font: 14px Arial, sans-serif; fill: #ffffff; }
      .note { font: 700 16px Arial, sans-serif; fill: #881337; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .label { font: 13px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#be123c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1020" fill="#f8fafc"/>
  <rect x="290" y="24" width="920" height="64" rx="0" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="750" y="50" text-anchor="middle" class="title">Current FLO V2 Stack</text>
  <text x="750" y="75" text-anchor="middle" class="body-white">Root issue: real hardware follows simulated /joint_states</text>

  <rect x="40" y="130" width="280" height="160" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" class="h1">Windows Host</text>
  <text x="60" y="195" class="body">- Windows-only software</text>
  <text x="60" y="220" class="body">- Docker Desktop</text>
  <text x="60" y="245" class="body">- usbipd-win</text>

  <rect x="380" y="130" width="280" height="160" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="160" text-anchor="middle" class="h1">WSL2 Ubuntu</text>
  <text x="400" y="195" class="body">- Linux VM kernel</text>
  <text x="400" y="220" class="body">- /dev/ttyUSB0 attached here</text>
  <text x="400" y="245" class="body">- Docker CLI</text>

  <rect x="720" y="130" width="360" height="160" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="900" y="160" text-anchor="middle" class="h1">ROS Docker Container</text>
  <text x="740" y="195" class="body">- roscore</text>
  <text x="740" y="220" class="body">- MoveIt move_group</text>
  <text x="740" y="245" class="body">- Gazebo sim</text>
  <text x="740" y="270" class="body">- joint_trajectory_controller (sim only)</text>

  <rect x="730" y="350" width="240" height="110" rx="16" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
  <text x="850" y="380" text-anchor="middle" class="h1">Gazebo robot</text>
  <text x="750" y="415" class="body">Sim controllers publish</text>
  <text x="750" y="440" class="body">/joint_states</text>

  <rect x="650" y="530" width="420" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="860" y="562" text-anchor="middle" class="h1">joint_state_to_dual_arm_motors.py</text>
  <text x="680" y="595" class="body">Bridge: /joint_states -&gt; /set_arms_joint_positions</text>

  <rect x="700" y="710" width="320" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="860" y="742" text-anchor="middle" class="h1">read_write_arms_node</text>
  <text x="720" y="775" class="body">Bulk writes goal positions</text>
  <text x="720" y="800" class="body">to 8 Dynamixels over /dev/ttyUSB0</text>

  <rect x="760" y="890" width="200" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="922" text-anchor="middle" class="h1">Dynamixel bus</text>
  <text x="860" y="950" text-anchor="middle" class="body">8 motors</text>

  <path d="M320 210 L380 210" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="195" text-anchor="middle" class="label">usbipd USB pass-through</text>

  <path d="M660 210 L720 210" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="690" y="195" text-anchor="middle" class="label">Docker launches container</text>

  <path d="M900 290 L850 350" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="930" y="325" class="label">Sim trajectory execution</text>

  <path d="M850 460 L850 530" stroke="#be123c" stroke-width="4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="865" y="500" class="label">/joint_states</text>

  <path d="M860 640 L860 710" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="875" y="680" class="label">/set_arms_joint_positions</text>

  <path d="M860 820 L860 890" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="860" class="label">Serial writes on /dev/ttyUSB0</text>

  <rect x="1080" y="430" width="380" height="240" rx="18" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
  <text x="1105" y="465" class="note">ROOT ISSUE</text>
  <text x="1105" y="500" class="body">Real hardware is driven from simulated</text>
  <text x="1105" y="525" class="body">/joint_states instead of a deterministic</text>
  <text x="1105" y="550" class="body">hardware trajectory controller or</text>
  <text x="1105" y="575" class="body">FollowJointTrajectory action server.</text>
  <text x="1105" y="615" class="body">Any pause in Gazebo, ROS callbacks,</text>
  <text x="1105" y="640" class="body">Docker scheduling, WSL2, or USB</text>
  <text x="1105" y="665" class="body">forwarding becomes a visible motion freeze.</text>

  <path d="M1080 550 L1070 550 L1070 585" stroke="#be123c" stroke-width="3" fill="none"/>
  <path d="M1070 585 L1070 585 L1070 585" stroke="#be123c" stroke-width="3" fill="none"/>
  <path d="M1070 585 L1070 585" stroke="#be123c" stroke-width="3" fill="none"/>
  <path d="M1080 570 L1030 570 L1030 585 L1070 585" stroke="#be123c" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="1110" y="160" width="300" height="86" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1260" y="190" text-anchor="middle" class="h1">Timing risk accumulates</text>
  <text x="1260" y="216" text-anchor="middle" class="small">Windows + WSL2 + Docker + Gazebo + ROS</text>
  <path d="M1160 246 L240 130" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  <path d="M1260 246 L520 130" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  <path d="M1360 246 L900 130" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
</svg>
